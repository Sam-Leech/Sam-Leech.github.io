<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FRE | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1120;
            --panel: #111827;
            --border: #1f2937;
            --border-light: #273449;
            --text: #f8fafc;
            --muted: #94a3b8;
            --muted-dark: #64748b;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-dot {
            color: var(--blue);
        }

        .brand-subtitle {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted-dark);
        }

        .login-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 32px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .login-description {
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted);
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            background: #0f172a;
            border: 1px solid var(--border-light);
            border-radius: 7px;
            outline: none;
            color: var(--text);
            font-size: 13px;
        }

        input:focus {
            border-color: var(--blue);
            background: #111827;
        }

        #loginBtn {
            width: 100%;
            height: 44px;
            margin-top: 5px;
            border: 1px solid var(--blue);
            border-radius: 7px;
            background: var(--blue);
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        #loginBtn:hover {
            background: var(--blue-dark);
        }

        #loginBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            min-height: 18px;
            margin-top: 16px;
            text-align: center;
            color: #f87171;
            font-size: 12px;
            line-height: 1.4;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: var(--muted-dark);
            font-size: 11px;
        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="brand">

        <div class="brand-name">
            FRE<span class="brand-dot">.</span>
        </div>

        <div class="brand-subtitle">
            FRE Tools
        </div>

    </div>


    <div class="login-panel">


        <div class="login-title">
            Sign in
        </div>


        <div class="login-description">
            Sign in to access the FRE Tools portal.
        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="email">

                Email

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <button id="loginBtn">

            Login

        </button>


        <p id="message"></p>


    </div>


    <div class="footer">
        FRE Tools
    </div>


</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { app }
from "./firebase-config.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const auth =
    getAuth(app);



/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");



/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    message.innerText = "";


    if (!email || !password) {

        message.style.color =
            "#f87171";

        message.innerText =
            "Please enter your email and password.";

        return;

    }


    loginButton.disabled = true;

    loginButton.innerText =
        "Signing in...";


    try {

        /*
            Sign into Firebase.
        */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        console.log(
            "LOGIN SUCCESS:",
            result.user.email
        );


        message.style.color =
            "#10b981";

        message.innerText =
            "Login successful.";


        /*
            Give Firebase a moment to persist
            the authentication state before
            moving to the protected page.
        */

        await result.user.reload();


        window.location.replace(
            "downloads.html"
        );

    }

    catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        message.style.color =
            "#f87171";


        /*
            Show useful Firebase error.
        */

        switch (error.code) {

            case "auth/invalid-credential":

                message.innerText =
                    "Incorrect email or password.";

                break;


            case "auth/invalid-email":

                message.innerText =
                    "Please enter a valid email address.";

                break;


            case "auth/user-disabled":

                message.innerText =
                    "This account has been disabled.";

                break;


            case "auth/too-many-requests":

                message.innerText =
                    "Too many attempts. Please try again later.";

                break;


            default:

                message.innerText =
                    error.message;

        }


        loginButton.disabled = false;

        loginButton.innerText =
            "Login";

    }

}



/* =====================================================
   BUTTON
===================================================== */

loginButton.addEventListener(
    "click",
    login
);



/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    user => {

        console.log(
            "AUTH STATE:",
            user
                ? user.email
                : "NO USER"
        );

    }
);

</script>


</body>

</html>
