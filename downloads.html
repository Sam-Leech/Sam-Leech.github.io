<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0b1120;
    --sidebar: #0f172a;
    --panel: #111827;
    --panel-hover: #172033;
    --border: #1f2937;
    --border-light: #273449;
    --text: #f8fafc;
    --muted: #94a3b8;
    --muted-dark: #64748b;
    --blue: #3b82f6;
    --blue-dark: #2563eb;
}

body {
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 250px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 25px 16px;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    padding: 5px 12px 35px;
}

.brand-name {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.brand-dot {
    color: var(--blue);
}

.nav-section {
    margin-bottom: 25px;
}

.nav-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted-dark);
    padding: 0 12px;
    margin-bottom: 8px;
}

.nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    margin-bottom: 3px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
}

.nav-item:hover {
    background: #172033;
    color: var(--text);
}

.nav-item.active {
    background: rgba(59, 130, 246, 0.14);
    color: #60a5fa;
}

.nav-icon {
    width: 20px;
    display: flex;
    justify-content: center;
    font-size: 16px;
}

.sidebar-bottom {
    margin-top: auto;
}

.logout {
    color: #f87171;
}

.logout:hover {
    background: rgba(127, 29, 29, 0.25);
    color: #fca5a5;
}


/* =====================================================
   MAIN
===================================================== */

.main {
    margin-left: 250px;
    min-height: 100vh;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {
    height: 72px;
    background: var(--sidebar);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px;
}

.topbar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
}

.account {
    display: flex;
    align-items: center;
    gap: 11px;
}

.account-email {
    color: var(--muted);
    font-size: 13px;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
}


/* =====================================================
   CONTENT
===================================================== */

.content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 38px 60px;
}

.page-header {
    margin-bottom: 32px;
}

.page-title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.7px;
    margin-bottom: 8px;
}

.page-subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
}


/* =====================================================
   SEARCH
===================================================== */

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.search-wrapper {
    position: relative;
    flex: 1;
    max-width: 520px;
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);

    font-size: 15px;
}

.search {

    border-radius: 8px;
    outline: none;

    font-size: 13px;
}

.search::placeholder {
    color: var(--muted-dark);
}

.search:focus {
    border-color: var(--blue);
}

.document-count {
    font-size: 12px;
    color: var(--muted-dark);
}


/* =====================================================
   PANEL
===================================================== */

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    overflow: hidden;
}

.panel-header {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
}

.panel-title {
    font-size: 14px;
    font-weight: 600;
}

.panel-subtitle {
    font-size: 12px;
    color: var(--muted-dark);
}


/* =====================================================
   FOLDER
===================================================== */

.folder {
    border-bottom: 1px solid var(--border);
}

.folder:last-child {
    border-bottom: none;
}

.folder-header {
    min-height: 70px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
}

.folder-header:hover {
    background: var(--panel-hover);
}

.folder-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.folder-icon {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    background: rgba(245, 158, 11, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
}

.folder-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
}

.folder-count {
    font-size: 11px;
    color: var(--muted-dark);
}

.folder-arrow {
    font-size: 24px;
    color: var(--muted-dark);
    transition: transform 0.2s;
}

.folder-arrow.open {
    transform: rotate(90deg);
}

.folder-contents {
    display: none;
    border-top: 1px solid var(--border);
}

.folder-contents.open {
    display: block;
}


/* =====================================================
   DOCUMENT
===================================================== */

.document {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 17px 20px 17px 76px;
    border-bottom: 1px solid var(--border);
}

.document:last-child {
    border-bottom: none;
}

.document:hover {
    background: var(--panel-hover);
}

.document-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.document-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 8px;
    background: rgba(59, 130, 246, 0.12);
    color: #60a5fa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.document-details {
    min-width: 0;
}

.document-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.document-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted-dark);
    font-size: 11px;
}

.meta-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--muted-dark);
}


/* =====================================================
   BUTTONS
===================================================== */

.actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
}

.button {
    height: 34px;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: #182234;
    color: #cbd5e1;
    font-size: 12px;

    text-decoration: none;

.button:hover {

}

.button.email {
    background: var(--blue);
    border-color: var(--blue);

}

.button.email:hover {
    background: var(--blue-dark);
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted-dark);
    display: none;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

    .sidebar {

        justify-content: center;

    }

    .brand-name {

    }

    .brand-name::before {

    }

    .nav-item {
        justify-content: center;

    }

    .nav-item span:not(.nav-icon) {

    }

    .main {

    .content {

    }

    .topbar {
        padding: 0 20px;
    }

    .account-email {

}


@media (max-width: 600px) {

    .page-title {

        padding-left: 20px;

        flex-direction: column;
        gap: 15px;
    }

    .actions {
        width: 100%;
    }

    .button {
        flex: 1;
    }
}

<script type="module">


/* =====================================================

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


/* =====================================================
   DOCUMENT DATA
===================================================== */

let documents = [];


/* =====================================================
   FRE BACKEND
===================================================== */

const DOCUMENT_API_URL =
    "https://script.google.com/macros/s/AKfycbxxtqCP0YLKS0kd_fbNsE5FH8g8SSI3BPoqeve2TqCgvgZ5zM0bkNEGb33RpJ7Zxq61nA/exec";


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function isObject(value) {

    return (
        value !== null &&
        typeof value === "object"
    );

}


function normaliseItems(value) {

    if (Array.isArray(value)) {
        return value;
    }

    return [];

}


/* =====================================================
   LOAD DOCUMENT DATA
===================================================== */

async function loadDocumentData() {

    console.log(
        "Requesting documents from FRE backend..."
    );

    try {

        const response =
            await fetch(
                DOCUMENT_API_URL +
                "?t=" +
                Date.now()
            );


        console.log(
            "Backend HTTP status:",
            response.status
        );


        console.log(
            "Backend content type:",
            response.headers.get("content-type")
        );


        if (!response.ok) {

            throw new Error(
                "Backend returned HTTP " +
                response.status
            );

        }


        /*
         * Read the response as TEXT first.
         *
         * This is deliberate.
         *
         * It means we can see exactly what
         * Google Apps Script actually sent.
         */

        const rawText =
            await response.text();


        console.log(
            "RAW FRE BACKEND RESPONSE:",
            rawText
        );


        if (!rawText || !rawText.trim()) {

            throw new Error(
                "FRE backend returned an empty response."
            );

        }


        let data;


        try {

            data =
                JSON.parse(
                    rawText
                );

        }

        catch (parseError) {

            console.error(
                "JSON parsing failed.",
                parseError
            );

            throw new Error(
                "FRE backend did not return valid JSON."
            );

        }


        console.log(
            "PARSED FRE BACKEND RESPONSE:",
            data
        );


        console.log(
            "Backend data type:",
            typeof data
        );


        console.log(
            "Backend is array:",
            Array.isArray(data)
        );


        /*
         * Normally the Apps Script returns:
         *
         * [
         *   {
         *      type: "folder",
         *      name: "Logs",
         *      items: [...]
         *   }
         * ]
         *
         * Handle that first.
         */

        if (Array.isArray(data)) {

            documents =
                data;

        }


        /*
         * If the backend has somehow returned the
         * array as a JSON string, parse it again.
         */

        else if (
            typeof data === "string"
        ) {

            let secondParse;

            try {

                secondParse =
                    JSON.parse(data);

            }

            catch (error) {

                throw new Error(
                    "Backend returned a JSON string, but it could not be parsed."
                );

            }


            if (
                !Array.isArray(
                    secondParse
                )
            ) {

                throw new Error(
                    "Backend JSON string does not contain a document list."
                );

            }


            documents =
                secondParse;

        }


        /*
         * If the backend returns an object
         * containing the list under "documents"
         * or "data", support that too.
         */

        else if (
            isObject(data) &&
            Array.isArray(data.documents)
        ) {

            documents =
                data.documents;

        }


        else if (
            isObject(data) &&
            Array.isArray(data.data)
        ) {

            documents =
                data.data;

        }


        else {

            console.error(
                "Unexpected backend structure:",
                data
            );

            throw new Error(
                "FRE backend did not return a document list."
            );

        }


        console.log(
            "VALIDATED DOCUMENT LIST:",
            documents
        );


        console.log(
            "Number of top-level entries:",
            documents.length
        );


        loadDocuments(
            documents
        );

    }

    catch (error) {

        console.error(
            "DOCUMENT LOAD ERROR:",
            error
        );


        documents =
            [];


        const count =
            document.getElementById(
                "documentCount"
            );


        const empty =
            document.getElementById(
                "emptyState"
            );


        if (count) {

            count.textContent =
                "0 documents";

        }


        if (empty) {

            empty.textContent =
                "Unable to load documents.";

            empty.style.display =
                "block";

        }


        alert(
            "Error loading documents from FRE backend:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   COUNT DOCUMENTS
===================================================== */

function countDocuments(items) {

    const safeItems =
        normaliseItems(items);


    let count = 0;


    safeItems.forEach(
        item => {

            if (!isObject(item)) {
                return;
            }


            if (
                item.type ===
                "document"
            ) {

                count++;

                return;

            }


            if (
                item.type ===
                "folder"
            ) {

                count +=
                    countDocuments(
                        item.items
                    );

            }

        }
    );


    return count;

}


/* =====================================================
   CREATE DOCUMENT
===================================================== */

function createDocument(doc) {

    if (!isObject(doc)) {

        return null;

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "document";


    const fileType =
        String(
            doc.fileType || ""
        );


    const documentName =
        String(
            doc.name ||
            "Unnamed document"
        );


    const documentLink =
        String(
            doc.link ||
            "#"
        );


    const icon =
        fileType.toUpperCase() === "PDF"
            ? "▤"
            : "▦";


    div.innerHTML = `

        <div class="document-left">

            <div class="document-icon">
                ${icon}
            </div>


            <div class="document-details">

                <div class="document-name">
                    ${escapeHtml(documentName)}
                </div>


                <div class="document-meta">

                    <span>
                        ${escapeHtml(fileType)}
                    </span>

                    <span class="meta-dot"></span>

                    <span>
                        Available
                    </span>

                </div>

            </div>

        </div>


        <div class="actions">

            <a
                class="button"
                href="${escapeHtml(documentLink)}"
                target="_blank"
                rel="noopener noreferrer">

                Open

            </a>


            <button
                class="button email"
                type="button">

                Email

            </button>

        </div>

    `;


    const emailButton =
        div.querySelector(
            ".email"
        );


    if (emailButton) {

        emailButton.addEventListener(
            "click",
            function () {

                emailDocument(
                    doc
                );

            }
        );

    }


    return div;

}


/* =====================================================
   CREATE FOLDER
===================================================== */

function createFolder(folder) {

    if (!isObject(folder)) {

        return null;

    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "folder";


    const header =
        document.createElement(
            "div"
        );


    header.className =
        "folder-header";


    /*
     * IMPORTANT:
     *
     * Always convert folder.items
     * into an actual array before
     * doing anything with it.
     */

    const items =
        normaliseItems(
            folder.items
        );


    const itemCount =
        countDocuments(
            items
        );


    const folderName =
        String(
            folder.name ||
            "Unnamed folder"
        );


    header.innerHTML = `

        <div class="folder-left">

            <div class="folder-icon">
                📁
            </div>


            <div>

                <div class="folder-name">
                    ${escapeHtml(folderName)}
                </div>


                <div class="folder-count">

                    ${itemCount}
                    ${itemCount === 1
                        ? " document"
                        : " documents"}

                </div>

            </div>

        </div>


        <div class="folder-arrow">
            ›
        </div>

    `;


    const contents =
        document.createElement(
            "div"
        );


    contents.className =
        "folder-contents";


    /*
     * IMPORTANT:
     *
     * We are only calling forEach
     * on "items", which was already
     * confirmed to be an array.
     */

    items.forEach(
        item => {

            if (
                isObject(item) &&
                item.type ===
                "document"
            ) {

                const documentElement =
                    createDocument(
                        item
                    );


                if (documentElement) {

                    contents.appendChild(
                        documentElement
                    );

                }

            }

        }
    );


    header.addEventListener(
        "click",
        function () {

            contents.classList.toggle(
                "open"
            );


            const arrow =
                header.querySelector(
                    ".folder-arrow"
                );


            if (arrow) {

                arrow.classList.toggle(
                    "open"
                );

            }

        }
    );


    wrapper.appendChild(
        header
    );


    wrapper.appendChild(
        contents
    );


    return wrapper;

}


/* =====================================================
   DISPLAY DOCUMENTS
===================================================== */

function loadDocuments(list) {

    const container =
        document.getElementById(
            "documentList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    const count =
        document.getElementById(
            "documentCount"
        );


    if (!container) {

        console.error(
            "documentList element not found."
        );

        return;

    }


    container.innerHTML =
        "";


    /*
     * Do not attempt to render
     * anything that isn't an array.
     */

    if (!Array.isArray(list)) {

        console.error(
            "loadDocuments received:",
            list
        );

        if (count) {

            count.textContent =
                "0 documents";

        }

        if (empty) {

            empty.textContent =
                "No documents found.";

            empty.style.display =
                "block";

        }

        return;

    }


    const total =
        countDocuments(
            list
        );


    if (count) {

        count.textContent =
            total +
            " " +
            (
                total === 1
                    ? "document"
                    : "documents"
            );

    }


    if (total === 0) {

        if (empty) {

            empty.textContent =
                "No documents found.";

            empty.style.display =
                "block";

        }

        return;

    }


    if (empty) {

        empty.style.display =
            "none";

    }


    /*
     * Only top-level folders
     * are rendered here.
     */

    list.forEach(
        item => {

            if (
                isObject(item) &&
                item.type ===
                "folder"
            ) {

                const folderElement =
                    createFolder(
                        item
                    );


                if (folderElement) {

                    container.appendChild(
                        folderElement
                    );

                }

            }

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            /*
             * Empty search restores
             * the complete backend data.
             */

            if (!search) {

                loadDocuments(
                    documents
                );

                return;

            }


            if (
                !Array.isArray(
                    documents
                )
            ) {

                console.error(
                    "Invalid documents during search:",
                    documents
                );

                return;

            }


            const filtered = [];


            documents.forEach(
                folder => {

                    if (
                        !isObject(folder) ||
                        folder.type !==
                        "folder"
                    ) {

                        return;

                    }


                    const items =
                        normaliseItems(
                            folder.items
                        );


                    const folderName =
                        String(
                            folder.name ||
                            ""
                        ).toLowerCase();


                    /*
                     * If the folder itself matches,
                     * keep all of its documents.
                     */

                    if (
                        folderName.includes(
                            search
                        )
                    ) {

                        filtered.push({

                            type:
                                "folder",

                            name:
                                folder.name,

                            items:
                                items

                        });

                        return;

                    }


                    /*
                     * Otherwise find matching
                     * documents within the folder.
                     */

                    const matchingItems =
                        items.filter(
                            doc => {

                                if (
                                    !isObject(doc) ||
                                    doc.type !==
                                    "document"
                                ) {

                                    return false;

                                }


                                const name =
                                    String(
                                        doc.name ||
                                        ""
                                    ).toLowerCase();


                                return name.includes(
                                    search
                                );

                            }
                        );


                    if (
                        matchingItems.length > 0
                    ) {

                        filtered.push({

                            type:
                                "folder",

                            name:
                                folder.name,

                            items:
                                matchingItems

                        });

                    }

                }
            );


            loadDocuments(
                filtered
            );

        }
    );


/* =====================================================
   EMAIL DOCUMENT
===================================================== */

function emailDocument(doc) {

    const user =
        auth.currentUser;


    if (!user) {

        alert(
            "Your session has expired. Please log in again."
        );

        return;

    }


    const recipient =
        user.email;


    const subject =
        String(
            doc &&
            doc.name
                ? doc.name
                : "FRE Document"
        );


    const link =
        String(
            doc &&
            doc.link
                ? doc.link
                : ""
        );


    const body =
`Hi,

Please find the requested document at the link below:

${link}

Kind regards,

Sam`;


    const mailto =
        "mailto:" +
        encodeURIComponent(
            recipient
        ) +
        "?subject=" +
        encodeURIComponent(
            subject
        ) +
        "&body=" +
        encodeURIComponent(
            body
        );


    window.location.href =
        mailto;

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async function (user) {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        console.log(
            "Logged in:",
            user.email
        );


        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (userEmail) {

            userEmail.textContent =
                user.email;

        }


        const avatar =
            document.getElementById(
                "avatar"
            );


        if (avatar) {

            avatar.textContent =
                user.email
                    .charAt(0)
                    .toUpperCase();

        }


        /*
         * Only request the document
         * catalogue after Firebase
         * authentication succeeds.
         */

        await loadDocumentData();

    }
);


/* =====================================================
   ACTIVE SIDEBAR
===================================================== */

const currentPage =
    window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


document
    .querySelectorAll(
        ".nav-item"
    )
    .forEach(
        function (link) {

            const href =
                link.getAttribute(
                    "href"
                );


            if (!href) {
                return;
            }


            const linkPage =
                href
                    .split("/")
                    .pop()
                    .toLowerCase();


            if (
                linkPage ===
                currentPage
            ) {

                link.classList.add(
                    "active"
                );

            }

        }
    );
