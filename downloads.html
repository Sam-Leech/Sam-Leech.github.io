    <style>

        :root {

        .panel-title {

           DOCUMENT

        .document {
            display: flex;

            justify-content: space-between;

            padding: 17px 20px;

            border-bottom: 1px solid var(--border);

            transition: background 0.15s;

            border-bottom: none;

        .document:hover {

        .document-left {
            display: flex;

        .document-icon {
            width: 42px;

            flex-shrink: 0;

            border-radius: 8px;

        .document-name {
            font-size: 13px;

        }


        .meta-dot {
            width: 3px;

           ACTIONS
        ========================= */

        .actions {
            display: flex;

            gap: 7px;

        }


        .button {
            height: 34px;

            padding: 0 12px;

            align-items: center;

            justify-content: center;

            gap: 6px;

            border-radius: 6px;

            border: 1px solid var(--border-light);

            background: #182234;

            color: #cbd5e1;

            font-size: 12px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.15s,
                border 0.15s;
        }


        .button:hover {
            background: #243149;

            border-color: #334155;

            color: white;
        }


        .button.email {
            background: var(--blue);

            border-color: var(--blue);

            color: white;
        }


        .button.email:hover {
            background: var(--blue-dark);

            border-color: var(--blue-dark);
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 70px 20px;

            text-align: center;

            color: var(--muted-dark);

            display: none;
        }


        .empty-icon {
            font-size: 32px;

            margin-bottom: 12px;
        }


        .empty-title {
            color: var(--muted);

        /* =========================
           LOGOUT
        ========================= */

        .logout {
            color: #f87171;
        }


        .logout:hover {

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 68px;

                padding: 20px 8px;
            }


            .brand {
                justify-content: center;

                padding: 5px 0 30px;
            }


            .brand-name {
                font-size: 0;
            }


            .brand-name::before {
                content: "F";

                font-size: 22px;
            }


            .brand-dot {
                display: none;
            }


            .nav-label {
                display: none;
            }


            .nav-item {
                justify-content: center;

                padding: 12px 0;
            }


            .nav-item span:not(.nav-icon) {
                display: none;
            }


            .main {
                margin-left: 68px;
            }


            .content {
                padding: 28px 20px 50px;
            }

            }


            .toolbar {

            }


            .search-wrapper {
                max-width: none;

            }


            .document-count {
                display: block;

                padding-bottom: 5px;
            }


            .document {
                align-items: flex-start;

                flex-direction: column;

            }


            .document-left {
                width: 100%;
            }


            .actions {
                width: 100%;
            }

            }

        }

    </style>

</head>

<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyAVqaht2BVQgVkZFcwMZ3t34DQeA2uFYuU",

    authDomain:
        "fre-tools.firebaseapp.com",

    projectId:
        "fre-tools",

    storageBucket:
        "fre-tools.firebasestorage.app",

    messagingSenderId:
        "723940111430",

    appId:
        "1:723940111430:web:50cb5685913167f0dc4647"

};



const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);



/* =========================
   DOCUMENTS
========================= */
let documents = [];

async function loadDocumentsFromFile() {

    try {

        const response = await fetch("documents.json");

        if (!response.ok) {
            throw new Error("Unable to load documents");
        }

        documents = await response.json();

        loadDocuments();

    } catch (error) {

        console.error(error);

        document.getElementById("documentList").innerHTML = `
            <div style="padding:25px;color:#f87171;">
                Unable to load documents.
            </div>
        `;

    }

}


/* =========================
   LOAD DOCUMENTS
========================= */

function loadDocuments(list = documents) {


    const container =
        document.getElementById("documentList");


    const empty =
        document.getElementById("emptyState");


    const count =
        document.getElementById("documentCount");


    container.innerHTML = "";


    count.textContent =
        `${list.length} ${
            list.length === 1
                ? "document"
                : "documents"
        }`;


    if (list.length === 0) {

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    list.forEach((doc) => {


        const div =
            document.createElement("div");


        div.className =
            "document";


        div.innerHTML = `

            <div class="document-left">

                <div class="document-icon">
                    ▣
                </div>


                <div class="document-details">

                    <div class="document-name">
                        ${doc.name}
                    </div>


                    <div class="document-meta">

                        <span>
                            ${doc.type}
                        </span>

                        <span class="meta-dot"></span>

                        <span>
                            Available
                        </span>

                    </div>

                </div>

            </div>


            <div class="actions">


                <a
                    class="button"
                    href="${doc.link}"
                    target="_blank"
                    rel="noopener noreferrer">

                    Open

                </a>


                <button
                    class="button email"
                    type="button">

                    Email

                </button>


            </div>

        `;


        const emailButton =
            div.querySelector(".email");


        emailButton.addEventListener(
            "click",
            () => emailDocument(doc)
        );


        container.appendChild(div);

    });

}



/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {


            const search =
                this.value
                    .trim()
                    .toLowerCase();


            const filtered =
                documents.filter(
                    doc =>
                        doc.name
                            .toLowerCase()
                            .includes(search)
                );


            loadDocuments(filtered);

        }
    );



/* =========================
   EMAIL DOCUMENT
========================= */

function emailDocument(doc) {


    const user =
        auth.currentUser;


    if (!user) {

        alert(
            "Your session has expired. Please log in again."
        );

        return;

    }


    /*
        At this stage the Firebase user's
        email is used as the recipient.

        We can later replace this with the
        recipient stored against each document.
    */

    const recipient =
        user.email;


    const subject =
        doc.name;


    const body =
`Hi,

Please find the requested document at the link below:

${doc.link}

Kind regards,

Sam`;


    const mailto =
        "mailto:" +
        encodeURIComponent(recipient) +

        "?subject=" +
        encodeURIComponent(subject) +

        "&body=" +
        encodeURIComponent(body);


    window.location.href =
        mailto;

}



/* =========================
   AUTHENTICATION
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        console.log(
            "Logged in:",
            user.email
        );


        /*
            Account email
        */

        document
            .getElementById("userEmail")
            .textContent =
                user.email;


        /*
            Avatar
        */

        document
            .getElementById("avatar")
            .textContent =
                user.email
                    .charAt(0)
                    .toUpperCase();


        /*
            Load documents from documents.json
        */

        await loadDocumentsFromFile();

    }
);



/* =========================
   ACTIVE SIDEBAR LINK
========================= */

const currentPage =
    window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


document
    .querySelectorAll(".nav-item")
    .forEach(link => {

        const linkPage =
            link.getAttribute("href")
                ?.split("/")
                .pop()
                .toLowerCase();


        if (linkPage === currentPage) {

            link.classList.add("active");

        }

    });
/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {


            try {

                await signOut(auth);

                window.location.href =
                    "login.html";

            }

            catch (error) {

                console.error(
                    "Logout failed:",
                    error
                );

                alert(
                    "Unable to log out. Please try again."
                );

            }

        }
    );

</script>


</body>

</html>
