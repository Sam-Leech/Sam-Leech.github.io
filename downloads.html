<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FRE | Documents</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1120;
            --sidebar: #0f172a;
            --panel: #111827;
            --panel-hover: #172033;
            --border: #1f2937;
            --border-light: #273449;
            --text: #f8fafc;
            --muted: #94a3b8;
            --muted-dark: #64748b;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 25px 16px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            padding: 5px 12px 35px;
        }

        .brand-name {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-dot {
            color: var(--blue);
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted-dark);
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            margin-bottom: 3px;
            border-radius: 8px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .nav-item:hover {
            background: #172033;
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.14);
            color: #60a5fa;
        }

        .nav-icon {
            width: 20px;
            display: flex;
            justify-content: center;
            font-size: 16px;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            color: #f87171;
        }

        .logout:hover {
            background: rgba(127, 29, 29, 0.25);
            color: #fca5a5;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 250px;
            min-height: 100vh;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 72px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 34px;
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
        }

        .account {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .account-email {
            color: var(--muted);
            font-size: 13px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 38px 60px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
        }

        /* =========================
           SEARCH
        ========================= */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 520px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-dark);
            font-size: 15px;
            pointer-events: none;
        }

        .search {
            width: 100%;
            height: 43px;
            padding: 0 15px 0 40px;
            background: var(--panel);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            font-size: 13px;
        }

        .search::placeholder {
            color: var(--muted-dark);
        }

        .search:focus {
            border-color: var(--blue);
        }

        .document-count {
            font-size: 12px;
            color: var(--muted-dark);
        }

        /* =========================
           PANEL
        ========================= */

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 11px;
            overflow: hidden;
        }

        .panel-header {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
        }

        .panel-subtitle {
            font-size: 12px;
            color: var(--muted-dark);
        }

        /* =========================
           DOCUMENT
        ========================= */

        .document {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 17px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .document:last-child {
            border-bottom: none;
        }

        .document:hover {
            background: var(--panel-hover);
        }

        .document-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .document-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .document-details {
            min-width: 0;
        }

        .document-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted-dark);
            font-size: 11px;
        }

        .meta-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--muted-dark);
        }

        /* =========================
           BUTTONS
        ========================= */

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        .button {
            height: 34px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            background: #182234;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, border 0.15s;
        }

        .button:hover {
            background: #243149;
            border-color: #334155;
            color: white;
        }

        .button.email {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }

        .button.email:hover {
            background: var(--blue-dark);
            border-color: var(--blue-dark);
        }

        /* =========================
           FOLDERS
        ========================= */

        .folder {
            border-bottom: 1px solid var(--border);
        }

        .folder:last-child {
            border-bottom: none;
        }

        .folder-header {
            min-height: 68px;
            padding: 13px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.15s;
        }

        .folder-header:hover {
            background: var(--panel-hover);
        }

        .folder-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .folder-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 8px;
            background: rgba(245, 158, 11, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .folder-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .folder-count {
            font-size: 11px;
            color: var(--muted-dark);
        }

        .folder-arrow {
            font-size: 23px;
            color: var(--muted-dark);
            transition: transform 0.2s;
        }

        .folder-arrow.open {
            transform: rotate(90deg);
        }

        .folder-contents {
            display: none;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.08);
        }

        .folder-contents.open {
            display: block;
        }

        .folder-contents .document {
            padding-left: 76px;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 70px 20px;
            text-align: center;
            color: var(--muted-dark);
            display: none;
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .empty-title {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .empty-text {
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 68px;
                padding: 20px 8px;
            }

            .brand {
                justify-content: center;
                padding: 5px 0 30px;
            }

            .brand-name {
                font-size: 0;
            }

            .brand-name::before {
                content: "F";
                font-size: 22px;
            }

            .brand-dot {
                display: none;
            }

            .nav-label {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 12px 0;
            }

            .nav-item span:not(.nav-icon) {
                display: none;
            }

            .main {
                margin-left: 68px;
            }

            .content {
                padding: 28px 20px 50px;
            }

            .topbar {
                padding: 0 20px;
            }

            .account-email {
                display: none;
            }
        }

        @media (max-width: 600px) {

            .page-title {
                font-size: 25px;
            }

            .toolbar {
                display: block;
            }

            .search-wrapper {
                max-width: none;
                margin-bottom: 10px;
            }

            .document-count {
                display: block;
                padding-bottom: 5px;
            }

            .document {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }

            .document-left {
                width: 100%;
            }

            .actions {
                width: 100%;
            }

            .button {
                flex: 1;
            }

            .folder-contents .document {
                padding-left: 20px;
            }
        }

    </style>

</head>

<script type="module">


/* =====================================================
   FIREBASE
   USE THE SAME CONFIG AS LOGIN.HTML
===================================================== */

import { app }
from "./firebase-config.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const auth = getAuth(app);



/* =====================================================
   DOCUMENTS
===================================================== */

let documents = [];



/* =====================================================
   LOAD JSON
===================================================== */

async function loadDocumentsFromFile() {

    try {

        const response =
            await fetch("documents.json");


        if (!response.ok) {

            throw new Error(
                "Unable to load documents.json"
            );

        }


        documents =
            await response.json();


        loadDocuments();

    }

    catch (error) {

        console.error(
            "Document loading error:",
            error
        );


        document
            .getElementById("documentList")
            .innerHTML = `

                <div
                    style="
                        padding:25px;
                        color:#f87171;
                    "
                >

                    Unable to load documents.

                </div>

            `;

    }

}



/* =====================================================
   COUNT DOCUMENTS
===================================================== */

function countDocuments(items) {

    let count = 0;


    items.forEach(item => {

        if (
            item.type === "document"
        ) {

            count++;

        }


        if (
            item.type === "folder" &&
            Array.isArray(item.items)
        ) {

            count +=
                countDocuments(
                    item.items
                );

        }

    });


    return count;

}



/* =====================================================
   DOCUMENT ICON
===================================================== */

function getDocumentIcon(type) {

    if (!type) {

        return "▣";

    }


    const value =
        type.toLowerCase();


    if (
        value.includes("google sheets")
    ) {

        return "▦";

    }


    if (
        value.includes("pdf")
    ) {

        return "▤";

    }


    return "▣";

}



/* =====================================================
   RENDER DOCUMENT
===================================================== */

function renderDocument(doc) {

    const div =
        document.createElement("div");


    div.className =
        "document";


    div.innerHTML = `

        <div class="document-left">

            <div class="document-icon">

                ${getDocumentIcon(
                    doc.fileType
                )}

            </div>


            <div class="document-details">

                <div class="document-name">

                    ${escapeHtml(
                        doc.name
                    )}

                </div>


                <div class="document-meta">

                    <span>

                        ${escapeHtml(
                            doc.fileType ||
                            "Document"
                        )}

                    </span>


                    <span class="meta-dot"></span>


                    <span>
                        Available
                    </span>

                </div>

            </div>

        </div>


        <div class="actions">

            <a
                class="button"
                href="${doc.link}"
                target="_blank"
                rel="noopener noreferrer"
            >

                Open

            </a>


            <button
                class="button email"
                type="button"
            >

                Email

            </button>

        </div>

    `;


    div
        .querySelector(".email")
        .addEventListener(
            "click",
            () => emailDocument(doc)
        );


    return div;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



/* =====================================================
   RENDER FOLDER
===================================================== */

function renderFolder(
    folder,
    search = ""
) {

    const wrapper =
        document.createElement("div");


    wrapper.className =
        "folder";


    const header =
        document.createElement("div");


    header.className =
        "folder-header";


    const count =
        countDocuments(
            folder.items || []
        );


    header.innerHTML = `

        <div class="folder-left">

            <div class="folder-icon">
                📁
            </div>


            <div>

                <div class="folder-name">

                    ${escapeHtml(
                        folder.name
                    )}

                </div>


                <div class="folder-count">

                    ${count}
                    ${count === 1
                        ? " document"
                        : " documents"
                    }

                </div>

            </div>

        </div>


        <div class="folder-arrow">
            ›
        </div>

    `;


    const contents =
        document.createElement("div");


    contents.className =
        "folder-contents";


    if (search) {

        contents.classList.add(
            "open"
        );


        header
            .querySelector(
                ".folder-arrow"
            )
            .classList.add(
                "open"
            );

    }


    header.addEventListener(
        "click",
        () => {

            contents.classList.toggle(
                "open"
            );


            header
                .querySelector(
                    ".folder-arrow"
                )
                .classList.toggle(
                    "open"
                );

        }
    );


    (folder.items || [])
        .forEach(item => {

            if (
                item.type === "folder"
            ) {

                contents.appendChild(
                    renderFolder(
                        item,
                        search
                    )
                );

            }


            else if (
                item.type === "document"
            ) {

                contents.appendChild(
                    renderDocument(item)
                );

            }

        });


    wrapper.appendChild(
        header
    );


    wrapper.appendChild(
        contents
    );


    return wrapper;

}



/* =====================================================
   SEARCH
===================================================== */

function itemMatchesSearch(
    item,
    search
) {

    if (!search) {

        return true;

    }


    if (
        item.name &&
        item.name
            .toLowerCase()
            .includes(search)
    ) {

        return true;

    }


    if (
        item.fileType &&
        item.fileType
            .toLowerCase()
            .includes(search)
    ) {

        return true;

    }


    if (
        item.type === "folder" &&
        Array.isArray(item.items)
    ) {

        return item.items.some(
            child =>
                itemMatchesSearch(
                    child,
                    search
                )
        );

    }


    return false;

}



function filterItems(
    items,
    search
) {

    if (!search) {

        return items;

    }


    return items
        .filter(
            item =>
                itemMatchesSearch(
                    item,
                    search
                )
        )
        .map(item => {

            if (
                item.type === "folder"
            ) {

                return {

                    ...item,

                    items:
                        filterItems(
                            item.items || [],
                            search
                        )

                };

            }


            return item;

        });

}



/* =====================================================
   DISPLAY DOCUMENTS
===================================================== */

function loadDocuments(
    list = documents
) {

    const container =
        document.getElementById(
            "documentList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    const countElement =
        document.getElementById(
            "documentCount"
        );


    container.innerHTML = "";


    const total =
        countDocuments(list);


    countElement.textContent =
        `${total} ${
            total === 1
                ? "document"
                : "documents"
        }`;


    if (
        total === 0
    ) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    list.forEach(item => {

        if (
            item.type === "folder"
        ) {

            container.appendChild(
                renderFolder(
                    item,
                    search
                )
            );

        }


        else if (
            item.type === "document"
        ) {

            container.appendChild(
                renderDocument(item)
            );

        }

    });

}



/* =====================================================
   SEARCH EVENT
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            const filtered =
                filterItems(
                    documents,
                    search
                );


            loadDocuments(
                filtered
            );

        }
    );



/* =====================================================
   EMAIL
===================================================== */

function emailDocument(doc) {

    const user =
        auth.currentUser;


    if (!user) {

        alert(
            "Your session has expired. Please log in again."
        );

        return;

    }


    const recipient =
        user.email;


    const subject =
        doc.name;


    const body =
`Hi,

Please find the requested document at the link below:

${doc.link}

Kind regards,

Sam`;


    const mailto =
        "mailto:" +
        encodeURIComponent(
            recipient
        ) +
        "?subject=" +
        encodeURIComponent(
            subject
        ) +
        "&body=" +
        encodeURIComponent(
            body
        );


    window.location.href =
        mailto;

}



/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        console.log(
            "Firebase auth state:",
            user
        );


        if (!user) {

            /*
                IMPORTANT:
                Only redirect to login when Firebase
                has actually confirmed there is no user.
            */

            window.location.replace(
                "login.html"
            );

            return;

        }


        console.log(
            "Logged in:",
            user.email
        );


        document
            .getElementById(
                "userEmail"
            )
            .textContent =
                user.email;


        document
            .getElementById(
                "avatar"
            )
            .textContent =
                user.email
                    .charAt(0)
                    .toUpperCase();


        await loadDocumentsFromFile();

    }
);



/* =====================================================
   ACTIVE NAVIGATION
===================================================== */

const currentPage =
    window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


document
    .querySelectorAll(".nav-item")
    .forEach(link => {

        const linkPage =
            link
                .getAttribute("href")
                ?.split("/")
                .pop()
                .toLowerCase();


        if (
            linkPage === currentPage
        ) {

            link.classList.add(
                "active"
            );

        }

    });



/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                await signOut(
                    auth
                );


                window.location.replace(
                    "index.html"
                );

            }

            catch (error) {

                console.error(
                    "Logout failed:",
                    error
                );


                alert(
                    "Unable to log out. Please try again."
                );

            }

        }
    );

</script>
